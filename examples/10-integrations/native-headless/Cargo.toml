[package]
name = "native-headless"
version = "0.0.0"
edition = "2024"
license = "CC-BY-NC-ND-4.0"
publish = false

[features]
tracing = ["dep:tracing-subscriber", "aether-native-dom/tracing"]

[dependencies]
aether = { workspace = true, features = ["html", "hooks", "signals"] }
aether-native-dom = { workspace = true }
anyrender_vello = { workspace = true }
vello = { workspace = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
wgpu = { workspace = true }
wgpu_context = { workspace = true }
pollster = "0.4"
bytemuck = "1.25.2"
blitz-paint = { workspace = true, default-features = true }
blitz-traits = { workspace = true, default-features = true }
blitz-dom = { workspace = true, default-features = true }
atomic_refcell =  { workspace = true }
