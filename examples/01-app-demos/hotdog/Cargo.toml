[package]
name = "hotdog"
version = "0.1.0"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
publish = false

[dependencies]
aether = { workspace = true,  features = ["fullstack", "router"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { version = "0.32.0", optional = true, features = ["bundled"] } # Bundle SQLite so Windows/MSVC builds do not require an external sqlite3.lib.
anyhow = { workspace = true }

[features]
default = ["web", "server"]
web = ["aether/web"]
desktop = ["aether/desktop"]
native = ["aether/native"]
mobile = ["aether/mobile"]
server = ["aether/server", "dep:rusqlite"]
production = []
