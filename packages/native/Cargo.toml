[package]
name = "aether-native"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Native Blitz/Etalon renderer for the Aether toolkit (not an application)"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog", "vello-hybrid", "woff", "text-transform-icu", "apple-font-embolden"]
prelude = ["dep:aether-core-macro", "dep:aether-hooks", "dep:aether-signals", "dep:aether-stores", "dep:manganis"]

# DOM features
svg = ["blitz-dom/svg", "blitz-paint/svg"]
floats = ["blitz-dom/floats"]
autofocus = ["blitz-dom/autofocus"]
system-fonts = ["blitz-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["blitz-dom/complex-scripts"]
# WOFF/WOFF2 decoder. Default-on so wasm callers (which can't use system fonts)
# can bundle compressed fonts without extra setup.
woff = ["blitz-dom/woff"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
writing-mode = ["blitz-dom/writing-mode", "aether-native-dom/writing-mode"]

# Shell Features
clipboard = ["blitz-shell/clipboard"]
file-dialog = ["blitz-shell/file-dialog"]
accessibility = ["blitz-shell/accessibility", "blitz-dom/accessibility"]
data-uri = ["blitz-shell/data-uri"]

# Renderer features
vello = ["dep:anyrender_vello", "dep:etalon-context", "dep:etalon"]
vello-hybrid = ["dep:anyrender_vello_hybrid", "dep:etalon-context", "dep:etalon"]
skia = ["dep:anyrender_skia"]
skia-pixels = ["skia-raster-base", "anyrender_skia/pixels_window_renderer"]
skia-softbuffer = ["skia-raster-base", "anyrender_skia/softbuffer_window_renderer"]
skia-raster-base = ["dep:anyrender_skia"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]
# Software presentation after a native renderer initialization failure.
gpu-cpu-fallback = ["dep:anyrender_vello_cpu", "anyrender_vello_cpu/softbuffer_window_renderer"]

font-embolden = ["blitz-paint/font-embolden"]
apple-font-embolden = ["blitz-paint/apple-font-embolden"]
scrollbars = ["blitz-paint/scrollbars"]

# Browser engine for Aether-hosted apps is Chora (copied-frame sibling worker).
# Off by default so B1a window/lifecycle does not link the engine or require
# a published chora-client. Enable `chora` for B1b; never in-process with Blitz.
chora = ["dep:aether-chora-client"]

# Other features
# No-op on wasm32 (blitz_net::Provider needs tokio's threaded runtime); launch_cfg
# falls back to the in-process AetherNativeNetProvider there.
net = ["dep:tokio", "dep:blitz-net"]
html = ["dep:blitz-html"]

# Dev
hot-reload = ["dep:aether-devtools"]

# Debug/Logging
log-times = ["log-phase-times", "log-frame-times"]
log-phase-times = ["blitz-dom/log-phase-times"]
log-frame-times = [
  "anyrender_vello_cpu?/log_frame_times",
  "anyrender_vello?/log_frame_times",
  "anyrender_vello_hybrid?/log_frame_times",
  "anyrender_skia?/log_frame_times",
]
tracing = ["dep:tracing", "aether-native-dom/tracing", "blitz-shell/tracing", "blitz-dom/tracing", "blitz-html?/tracing", "blitz-net?/tracing"]

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true, features = ["custom-widget"] }
blitz-html = { workspace = true, optional = true }
# Painting is required by the shell even without SVG. Match the DOM's custom
# widget support in every renderer profile, including minimal CPU builds.
blitz-paint = { workspace = true, features = ["custom-widget"] }
blitz-traits = { workspace = true }
blitz-shell = { workspace = true, features = ["custom-widget"] }

# AnyRender dependencies
anyrender = { workspace = true }
peniko = { workspace = true }
anyrender_vello = { workspace = true, optional = true}
anyrender_vello_hybrid = { workspace = true, optional = true}
anyrender_vello_cpu = { workspace = true, optional = true}
anyrender_skia = { workspace = true, optional = true}
etalon-context = { workspace = true, optional = true }
etalon = { workspace = true, optional = true, default-features = false }

# Aether core dependencies
aether-core = { workspace = true }
aether-config-macros = { workspace = true }
aether-html = { workspace = true }
aether-native-dom = { workspace = true }
aether-asset-resolver = { workspace = true, features = ["native"] }
aether-history = { workspace = true }
aether-document = { workspace = true }
aether-cli-config = { workspace = true }

# Aether hot reload
aether-devtools = { workspace = true, optional = true }

# Aether prelude
aether-hooks = { workspace = true, optional = true }
aether-signals = { workspace = true, optional = true }
aether-stores = { workspace = true, optional = true }
aether-core-macro = { workspace = true, optional = true }
manganis = { workspace = true, features = ["aether"], optional = true }

# Windowing & Input
winit = { workspace = true }
keyboard-types = { workspace = true }

# IO & Networking
webbrowser = { workspace = true }

# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }
cfg-if = "1.0.4"
slotmap = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aether-chora-client = { path = "../chora-client", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
blitz-net = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false }

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
anyrender_vello_cpu = { workspace = true, features = ["pixels_window_renderer"]}

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "native_lifecycle_smoke"
path = "examples/native_lifecycle_smoke.rs"
required-features = ["prelude"]

[[example]]
name = "native_multiwindow_smoke"
path = "examples/native_multiwindow_smoke.rs"
required-features = ["prelude"]
