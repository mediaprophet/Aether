[package]
name = "aether-web"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "WASM Web-sys renderer for Aether"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "web", "wasm"]
rust-version = "1.85.0"
publish = false

[dependencies]
dioxus-web = { workspace = true, default-features = false }

[features]
default = ["dioxus-web/default"]
hydrate = ["dioxus-web/hydrate"]
mounted = ["dioxus-web/mounted"]
devtools = ["dioxus-web/devtools"]
document = ["dioxus-web/document"]
