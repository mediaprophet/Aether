[package]
name = "aether-core-macro"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Core macro for Aether Virtual DOM"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit"] }
aether-rsx = { workspace = true }
convert_case = { workspace = true }

[dev-dependencies]
aether = { workspace = true }
aether-html = { workspace = true, features = ["serialize"]}
rustversion = { workspace = true }
tokio = { workspace = true, features = ["full", "time"] }
trybuild = { workspace = true }

[features]
default = []

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
