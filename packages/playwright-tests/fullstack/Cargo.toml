[package]
name = "aether-playwright-fullstack-test"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aether = { workspace = true, features = ["fullstack"] }
futures.workspace = true
serde = { workspace = true }
tokio = { workspace = true, features = ["full"], optional = true }

[features]
default = []
server = ["aether/server", "dep:tokio"]
web = ["aether/web"]
