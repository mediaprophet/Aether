[package]
name = "aether-playwright-default-features-disabled-test"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aether = { workspace = true, features = ["fullstack"] }

[features]
# Web is a default feature, but it shouldn't actually be enabled in server builds
default = ["web"]
server = ["aether/server"]
web = ["aether/web"]
