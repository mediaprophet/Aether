[package]
name = "wasm-split-macro"
edition = "2024"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "macro crate for wasm-split - a tool for splitting up large WASM binaries into smaller chunks"
repository = "https://github.com/mediaprophet/Aether"
license = "CC-BY-NC-ND-4.0"
keywords = ["wasm", "cli", "split", "aether"]
rust-version = "1.85.0"


[dependencies]
syn = { workspace = true, features = ["full"] }
base16 = { workspace = true }
digest = { workspace = true }
quote = { workspace = true }
sha2 = { workspace = true }
proc-macro2 = { workspace = true }

[lib]
proc-macro = true
