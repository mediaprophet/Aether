[package]
name = "aether-autofmt"
version = { workspace = true }
edition = "2024"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Autofomatter for Aether RSX"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["web", "desktop", "mobile", "gui", "wasm"]

[dependencies]
aether-rsx = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
syn = { workspace = true, features = [
    "full",
    "extra-traits",
    "visit",
    "visit-mut",
] }
serde = { workspace = true, features = ["derive"] }
prettyplease = { workspace = true }
regex = "1.12.3"

[dev-dependencies]
pretty_assertions = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
