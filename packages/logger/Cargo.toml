[package]
name = "aether-logger"
version = { workspace = true }
edition = "2024"
description = "A logging utility to provide a standard interface whether you're targeting web desktop, fullstack, and more."
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
keywords = ["aether", "log", "logging"]
categories = ["development-tools::debugging"]


[dependencies]
aether-cli-config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "std", "env-filter"] }

[features]
default = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
aether = { workspace = true, features = ["fullstack"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
serde_json = { workspace = true }
wasm-bindgen-test = { workspace = true }
