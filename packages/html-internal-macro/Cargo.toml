[package]
name = "aether-html-internal-macro"
version = { workspace = true }
edition = "2024"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react", "liveview"]
license = "CC-BY-NC-ND-4.0"
description = "HTML function macros for Aether"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
convert_case = { workspace = true }

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/progress.rs"

[dev-dependencies]
trybuild = { workspace = true, features = ["diff"] }
