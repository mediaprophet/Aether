[package]
name = "aether-hooks"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Basic useful hooks for Aether."
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = []
nightly-features = []

[dependencies]
aether-core = { workspace = true }
aether-signals = { workspace = true }
futures-channel = { workspace = true }
tracing = { workspace = true }
slab = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
generational-box = { workspace = true }
rustversion = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true, default-features = false }
aether-core = { workspace = true }
aether = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element"] }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
