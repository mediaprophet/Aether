[package]
name = "aether-devtools"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
version = { workspace = true }
edition = "2024"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
description = "Hot reloading utilities for Aether"
keywords = ["dom", "ui", "gui", "react", "hot-reloading"]

[dependencies]
aether-signals = { workspace = true }
aether-core = { workspace = true, features = ["serialize"] }
aether-devtools-types = { workspace = true }
aether-cli-config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subsecond = { workspace = true }
thiserror = { workspace = true }

futures-util = { workspace = true, features = ["sink", "async-await-macro"], optional = true }
futures-channel = { workspace = true, optional = true }

# hot reloading serve
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[features]
default = []
serve = ["dep:futures-util", "dep:futures-channel"]
