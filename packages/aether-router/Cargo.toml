[package]
name = "aether-router"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Cross-platform router for Aether applications"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "aether", "wasm"]
rust-version = "1.85.0"
publish = false

[dependencies]
dioxus-router = { path = "../router", version = "=0.8.0-alpha.3", default-features = false }

[features]
default = ["dioxus-router/default"]
streaming = ["dioxus-router/streaming"]
wasm-split = ["dioxus-router/wasm-split"]
html = ["dioxus-router/html"]
