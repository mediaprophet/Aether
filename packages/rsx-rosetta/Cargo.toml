[package]
name = "aether-rsx-rosetta"
version = { workspace = true }
edition = "2024"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Autofomatter for Aether RSX"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aether-autofmt = { workspace = true }
aether-rsx = { workspace = true }
aether-html = { workspace = true, features = ["html-to-rsx"]}
html_parser = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
convert_case = { workspace = true }
htmlentity = "1.3.2"

[dev-dependencies]
pretty_assertions = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
