[package]
name = "aether-server"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
version = { workspace = true }
edition = "2024"
description = "Fullstack utilities for Aether: Build fullstack web, desktop, and mobile apps with a single codebase."
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["web", "desktop", "mobile", "gui", "server"]
resolver = "2"

[dependencies]

# Aether + SSR
subsecond = { workspace =  true }
aether-cli-config = { workspace = true }
aether-devtools = { workspace = true, features = ["serve"] }
aether-history = { workspace = true }
aether-signals = { workspace = true }
aether-hooks = { workspace = true }
aether-logger = { workspace = true }
aether-router = { workspace = true, features = ["streaming"], optional = true }
aether-fullstack-core = { workspace = true, features = ["server"] }
aether-core = { workspace = true }
aether-core-macro = { workspace = true }
aether-document = { workspace = true }
aether-html = { workspace = true }
generational-box = { workspace = true }


axum = { workspace = true, features = ["multipart", "ws", "json", "form", "tokio", "http1", "http2", "macros"]}
anyhow = { workspace = true }
dashmap = "6.2.1"
inventory = { workspace = true }
aether-ssr = { workspace = true }

hyper-util = { workspace = true, features = ["full"] }
hyper = { workspace = true }

# Web Integration
aether-interpreter-js = { workspace = true }

tracing = { workspace = true }
tracing-futures = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }

serde = { workspace = true }
futures-util = { workspace = true }
futures-channel = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }

url = { workspace = true, default-features = true }
serde_json = { workspace = true }

serde_qs = { workspace = true, default-features = true }
multer = { optional = true, workspace = true, default-features = true }
rkyv = { optional = true,  default-features = true, version = "0.8" }

futures = { workspace = true, default-features = true }
pin-project = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
tower-http = { workspace = true, features = ["fs"] }
tower = { workspace = true, features = ["util"] }
tower-layer = { version = "0.3.3", optional = true }
parking_lot = { workspace = true, features = ["send_guard"] }

http.workspace = true
enumset = "1.1.6"
http-body-util = "0.1.3"

chrono = { workspace = true }
rustc-hash = { workspace = true }
lru  = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "macros"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "rt-multi-thread", "macros", "net"] }

[dev-dependencies]
aether = { workspace = true, features = ["fullstack"] }
tokio = { workspace = true, features = ["full"] }

[features]
default = ["router", "document"]
document = []
router = ["dep:aether-router"]
default-tls = []
rustls = ["dep:rustls", "dep:hyper-rustls"]
axum-no-default = []
rkyv = ["dep:rkyv"]
server = []

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
