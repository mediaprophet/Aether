[package]
name = "depinfo"
version.workspace = true
edition = "2024"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
description = "Depinfo parser for Rust"
keywords = ["rustc", "cargo", "dep-info" ]

[dependencies]
thiserror = { workspace = true }
dunce = { workspace = true, optional = true }

[features]
default = ["canonicalize"]
canonicalize = ["dep:dunce"]
