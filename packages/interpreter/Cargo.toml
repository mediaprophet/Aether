[package]
name = "aether-interpreter-js"
version = { workspace = true }
edition = "2024"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "JS Interpreter for Aether - a concurrent renderer-agnostic Virtual DOM for interactive user experiences"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react", "wasm"]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Element",
    "Node",
] }
sledgehammer_bindgen = { version = "0.6.0", default-features = false, optional = true }
sledgehammer_utils = { version = "0.3.1", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
rustc-hash = { workspace = true, optional = true }

aether-core = { workspace = true, optional = true }
aether-core-types = { workspace = true, optional = true }
aether-html = { workspace = true, optional = true }

[build-dependencies]
lazy-js-bundle = { workspace = true }

[features]
default = []
serialize = ["dep:serde"]
sledgehammer = ["dep:sledgehammer_bindgen", "dep:sledgehammer_utils", "dep:rustc-hash"]
webonly = [
    "sledgehammer",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "sledgehammer_bindgen/web",
]
binary-protocol = ["sledgehammer", "dep:aether-core", "dep:aether-core-types", "dep:aether-html"]
minimal_bindings = []
