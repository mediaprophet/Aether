[package]
name = "aether-html"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "HTML Element pack for Aether - a concurrent renderer-agnostic Virtual DOM for interactive user experiences"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[dependencies]
aether-core = { workspace = true }
aether-core-macro = { workspace = true }
aether-core-types = { workspace = true }
aether-rsx = { workspace = true, optional = true }
aether-html-internal-macro = { workspace = true }
aether-hooks = { workspace = true }
generational-box = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_repr = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
keyboard-types = { workspace = true, default-features = false }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }
rustversion = { workspace = true }
euclid = "0.22.14"
enumset = "1.1.6"
bytes = { workspace = true }

[build-dependencies]
lazy-js-bundle = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
aether = { workspace = true }
aether-web = { workspace = true }
tokio = { workspace = true, features = ["time"] }
manganis = { workspace = true }

[features]
default = ["serialize"]
serialize = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_repr",
    "euclid/serde",
    "keyboard-types/serde",
    "aether-core/serialize",
    "bytes/serde"
]
hot-reload-context = ["dep:aether-rsx"]
html-to-rsx = []

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
feature = ["html-to-rsx", "hot-reload-context", "html-to-rsx"]
