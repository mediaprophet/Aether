[package]
name = "manganis-macro"
version.workspace = true
edition = "2024"
rust-version = "1.85.0"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Ergonomic, automatic, cross crate asset collection and optimization"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["assets"]

[lib]
proc-macro = true

# be careful with dependencies you add here - these need to get compiled for the proc macro and therefore
# prevent the main code from compiling!
[dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"] }
manganis-core = { workspace = true }
dunce = { workspace = true }
macro-string = { workspace = true }

[features]
default = []

[dev-dependencies]
manganis = { workspace = true }
tempfile = { workspace = true }
