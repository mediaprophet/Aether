[package]
name = "manganis-core"
edition = "2024"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "core for manganis"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "assets"]
readme = "../manganis/README.md"

# be careful with dependencies you add here - these need to get compiled for the proc macro and therefore
# prevent the main code from compiling!
[dependencies]
serde = { workspace = true, features = ["derive"] }
const-serialize = { package = "const-serialize", path = "../../const-serialize", version = "0.8.0-alpha.3", features = ["serde"] }
aether-core-types = { workspace = true, optional = true }
aether-cli-config = { workspace = true, optional = true }
winnow = { workspace = true }

[dev-dependencies]
manganis = { workspace = true }

[features]
aether = ["dep:aether-core-types", "dep:aether-cli-config"]
