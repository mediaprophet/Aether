[package]
name = "aether-rsx"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
license = "CC-BY-NC-ND-4.0"
description = "Core functionality for Aether - a concurrent renderer-agnostic Virtual DOM for interactive user experiences"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aether-core-template = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
proc-macro2-diagnostics = { workspace = true }
quote = { workspace = true }
rustversion.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut"] }

[features]
default = []

[dev-dependencies]
prettyplease = { workspace = true }
prettier-please = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
