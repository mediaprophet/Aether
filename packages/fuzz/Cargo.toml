[package]
name = "aether-vdom-fuzz"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
license = "CC-BY-NC-ND-4.0"
publish = false
rust-version = "1.85.0"

[dependencies]
aether = { workspace = true }
aether-core = { workspace = true }
aether-core-template = { workspace = true }
aether-renderer-oracle = { workspace = true }
aether-ssr = { workspace = true }
mutatis = { version = "0.5.2", features = ["alloc", "derive"] }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
