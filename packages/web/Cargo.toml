[package]
name = "aether-web"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Web-sys renderer for Aether: Build fullstack web, desktop, and mobile apps with a single codebase."
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "web", "wasm"]

[dependencies]
aether-core = { workspace = true }
aether-core-types = { workspace = true }
aether-cli-config = { workspace = true, features = ["web"] }
aether-html = { workspace = true }
aether-history = { workspace = true }
aether-document = { workspace = true }
aether-devtools = { workspace = true }
aether-signals = { workspace = true }
aether-interpreter-js = { workspace = true, features = [
    "minimal_bindings",
    "webonly",
] }
aether-fullstack-core = { workspace = true, features = ["web"], optional = true }
generational-box = { workspace = true }

js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true, features = ["std", "async-await", "async-await-macro"] }
futures-channel = { workspace = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }

ciborium = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true, features = ["futures"] }
send_wrapper = { workspace = true, features = ["futures"] }
wasm-streams = "0.5.0"

[dependencies.web-sys]
workspace = true
features = [
    "AnimationEvent",
    "ClipboardEvent",
    "CloseEvent",
    "Comment",
    "CompositionEvent",
    "console",
    "CustomEvent",
    "DataTransfer",
    "DataTransferItemList",
    "DataTransferItem",
    "Document",
    "DomRectReadOnly",
    "DragEvent",
    "FocusEvent",
    "History",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "IntersectionObserverEntry",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "NodeList",
    "PointerEvent",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ScrollRestoration",
    "ScrollToOptions",
    "Selection",
    "Text",
    "Touch",
    "TouchEvent",
    "TouchList",
    "TransitionEvent",
    "WheelEvent",
    "Window",
    "File",
    "FileList",
    "FileReader",
    "ReadableStream",
    "FormData"
]

[build-dependencies]
lazy-js-bundle = { workspace = true }

[features]
default = ["mounted", "devtools", "document"]
hydrate = ["web-sys/Comment", "dep:serde", "dep:aether-fullstack-core"]
mounted = [
    "web-sys/Element",
    "web-sys/Element",
    "web-sys/DomRect",
    "web-sys/ScrollIntoViewOptions",
    "web-sys/ScrollLogicalPosition",
    "web-sys/ScrollBehavior",
    "web-sys/HtmlElement",
]
devtools = [
  "web-sys/MessageEvent",
  "web-sys/WebSocket",
  "web-sys/Location",
  "dep:serde_json",
  "dep:serde",
  "aether-core/serialize",
  "dep:gloo-timers"
]
document = ["dep:serde-wasm-bindgen", "dep:serde_json", "dep:serde"]

[dev-dependencies]
aether = { workspace = true, default-features = true }
wasm-bindgen-test = { workspace = true }
aether-ssr = { workspace = true, default-features = false }
gloo-dialogs = { workspace = true }
aether-web = { path = ".", features = ["hydrate"] }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
