[package]
name = "aether-stores-macro"
version = { workspace = true }
edition = "2024"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react", "liveview"]
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Server function macros for Aether"

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"] }
convert_case = { workspace = true }

[dev-dependencies]
aether = { workspace = true }
aether-stores = { workspace = true }

[lib]
proc-macro = true

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
