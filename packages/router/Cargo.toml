[package]
name = "aether-router"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
version = { workspace = true }
edition = "2024"
description = "Cross-platform router for Aether apps"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react", "wasm"]

[dependencies]
aether-core = { workspace = true }
aether-core-macro = { workspace = true }
aether-signals = { workspace = true }
aether-hooks = { workspace = true }
aether-html = { workspace = true, optional = true }
aether-history = { workspace = true }
aether-router-macro = { workspace = true }
aether-fullstack-core = { workspace = true, optional = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }
aether-cli-config = { workspace = true }
rustversion = { workspace = true }

[features]
default = ["html"]
streaming = ["dep:aether-fullstack-core"]
wasm-split = []
html = ["dep:aether-html"]

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
aether = { workspace = true, features = ["router"] }
aether-ssr = { workspace = true }
criterion = { workspace = true, features = ["async_tokio", "html_reports"] }
ciborium = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
aether-router = { workspace = true }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

# Most of the examples live in the workspace. We include some here so that docs.rs can scrape our examples for better inline docs
[[example]]
name = "hash_fragment_state"
path = "../../examples/06-routing/hash_fragment_state.rs"
doc-scrape-examples = true

[[example]]
name = "query_segment_search"
path = "../../examples/06-routing/query_segment_search.rs"
doc-scrape-examples = true

[[example]]
name = "simple_router"
path = "../../examples/06-routing/simple_router.rs"
doc-scrape-examples = true
