[package]
name = "aether-fullstack-core"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
version = { workspace = true }
edition = "2024"
description = "Hooks for serializing futures, values in aether-fullstack and other utilities"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["web", "gui", "server"]
resolver = "2"

[dependencies]
aether-core = { workspace = true, features = ["serialize"]}
aether-signals = { workspace = true }
aether-hooks = { workspace = true }
futures-channel = { workspace = true }
serde = { workspace = true }
aether-history = { workspace = true }
aether-document = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum-core = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
inventory = { workspace = true }
serde_json = { workspace = true }
generational-box = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt"] }
parking_lot = { workspace = true }

[features]
web = []
server = []

[dev-dependencies]
aether-fullstack = { workspace = true }
aether = { workspace = true, features = ["fullstack"] }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
