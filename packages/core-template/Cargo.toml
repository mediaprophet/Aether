[package]
name = "aether-core-template"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Static template representation and const builder for Aether."
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]
rust-version = "1.85.0"

[dependencies]
aether-const-vec = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
xxhash-rust = { workspace = true, features = ["const_xxh64"] }

[features]
serialize = ["dep:serde"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
