[package]
name = "aether-liveview"
version = { workspace = true }
edition = "2024"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react", "liveview"]
description = "Build server-side apps with Aether"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
slab = { workspace = true }
futures-util = { workspace = true, default-features = false, features = [
    "sink",
] }
futures-channel = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
aether-html = { workspace = true, features = ["serialize"] }
aether-document = { workspace = true }
aether-history = { workspace = true }
rustc-hash = { workspace = true }
aether-core = { workspace = true, features = ["serialize"] }
aether-interpreter-js = { workspace = true, features = ["binary-protocol"] }
aether-devtools = { workspace = true, optional = true }
aether-cli-config = { workspace = true }
generational-box = { workspace = true }

# axum
axum = { workspace = true, optional = true, default-features = true, features = ["ws"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
aether = { workspace = true }

[features]
default = ["devtools", "multi-thread"]
axum = ["dep:axum"]
multi-thread = ["tokio/rt-multi-thread"]
devtools = ["dep:aether-devtools"]

[[example]]
name = "axum"
required-features = ["axum"]
doc-scrape-examples = true

[[example]]
name = "axum_stress"
required-features = ["axum"]
doc-scrape-examples = true
