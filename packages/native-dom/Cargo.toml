[package]
name = "aether-native-dom"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "Core headless native renderer for Aether based on blitz"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "svg", "system-fonts", "text-transform-icu"]

# DOM features
svg = ["blitz-dom/svg"]
floats = ["blitz-dom/floats"]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
system-fonts = ["blitz-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["blitz-dom/complex-scripts"]
autofocus = ["blitz-dom/autofocus"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
writing-mode = ["blitz-dom/writing-mode"]

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true, default-features = false, features = ["custom-widget"] }
blitz-traits = { workspace = true }

# Aether core dependencies
aether-core = { workspace = true }
aether-html = { workspace = true }

# Windowing & Input
keyboard-types = { workspace = true }


# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
aether = { workspace = true }

[package.metadata.docs.rs]
all-features = true
