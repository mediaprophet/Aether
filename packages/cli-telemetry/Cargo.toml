[package]
name = "aether-cli-telemetry"
edition = "2024"
version.workspace = true
description = "Wire format for the aether CLI telemetry type"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "react"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["serde"] }
rand = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
