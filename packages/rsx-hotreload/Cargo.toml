[package]
name = "dioxus-rsx-hotreload"
edition = "2024"
version.workspace = true
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
description = "CLI Configuration for dioxus-cli"
keywords = ["dom", "ui", "gui", "react"]

[dependencies]
dioxus-rsx = { workspace = true }
dioxus-core-template = { workspace = true }
internment = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
proc-macro2-diagnostics = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut"] }
tracing = { workspace = true }
dioxus-core = { workspace = true }
dioxus-core-types = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }
dioxus-html = { workspace = true, features = ["hot-reload-context"] }
dioxus-signals = { workspace = true }
dioxus-ssr = { workspace = true }
