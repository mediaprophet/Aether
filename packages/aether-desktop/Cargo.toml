[package]
name = "aether-desktop"
version = { workspace = true }
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "WebView desktop renderer for Aether with WebGPU and W3C limits compatibility shim"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
documentation = "https://github.com/mediaprophet/Aether"
keywords = ["dom", "ui", "gui", "aether"]
rust-version = "1.85.0"
publish = false

[dependencies]
dioxus-desktop = { workspace = true, default-features = false }

[features]
default = ["dioxus-desktop/default"]
tokio_runtime = ["dioxus-desktop/tokio_runtime"]
fullscreen = ["dioxus-desktop/fullscreen"]
devtools = ["dioxus-desktop/devtools"]
transparent = ["dioxus-desktop/transparent"]
gnu = ["dioxus-desktop/gnu"]
