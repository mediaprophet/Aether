[package]
name = "const-serialize"
version = "0.8.0-alpha.3"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
edition = "2024"
description = "A serialization framework that works in const contexts"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/mediaprophet/Aether"
homepage = "https://github.com/mediaprophet/Aether"
keywords = ["const", "serialize"]
rust-version = "1.85.0"

[dependencies]
dioxus-const-vec = { workspace = true }
const-serialize-macro = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
rand = { workspace = true }

[features]
test-big-endian = []
serde = ["dep:serde"]
